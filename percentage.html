<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage Calculator — Calculate This</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><style>.calcpage{width:min(860px,88vw);margin:auto;padding:150px 0 100px}.calcpage h1{font:500 clamp(48px,7vw,80px)/1 "Playfair Display",serif;margin:14px 0}.calcpage>p{color:#9fa8aa;font-size:18px}.calc{margin-top:50px;padding:clamp(24px,5vw,50px);border:1px solid #263034;border-radius:24px;background:#0e1416}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-size:13px;color:#9fa8aa;margin-bottom:8px}.field input{width:100%;padding:16px;border-radius:12px;border:1px solid #334044;background:#090d0f;color:white;font:inherit;font-size:18px}.result{margin-top:24px;padding:28px;border-radius:16px;background:#151d20}.result small{color:#9fa8aa}.result strong{display:block;font:500 48px/1.2 "Playfair Display",serif;color:#f4b183;margin-top:8px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><header class="nav"><a class="brand" href="index.html"><span class="mark">⌁</span><span>Calculate This</span></a></header><main class="calcpage"><p class="eyebrow">MONEY & EVERYDAY</p><h1>Percentage Calculator</h1><p>Find any percentage of a number instantly.</p><section class="calc"><div class="row"><div class="field"><label for="pct">What percentage?</label><input id="pct" type="number" inputmode="decimal" placeholder="e.g. 20"></div><div class="field"><label for="num">Of what number?</label><input id="num" type="number" inputmode="decimal" placeholder="e.g. 150"></div></div><div class="result"><small>Result</small><strong id="result">—</strong><span id="working"></span></div></section></main><script>const p=document.getElementById("pct"),n=document.getElementById("num"),r=document.getElementById("result"),w=document.getElementById("working");function c(){const a=parseFloat(p.value),b=parseFloat(n.value);if(Number.isFinite(a)&&Number.isFinite(b)){const x=a/100*b;r.textContent=new Intl.NumberFormat(undefined,{maximumFractionDigits:8}).format(x);w.textContent=`${a}% of ${b} = ${x}`}else{r.textContent="—";w.textContent=""}}p.addEventListener("input",c);n.addEventListener("input",c)</script></body></html>
