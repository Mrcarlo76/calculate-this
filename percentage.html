<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage Calculator — Calculate This</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><a class="brand" href="index.html"><span class="mark">⌁</span><span>Calculate This</span></a></header><main class="section"><p class="eyebrow">MONEY & EVERYDAY</p><h1 style="font-family:serif;font-size:56px">Percentage Calculator</h1><p>Find any percentage of a number instantly.</p><div style="margin-top:40px;padding:30px;border:1px solid #263034;border-radius:24px;background:#0e1416"><input id="pct" type="number" placeholder="Percentage" style="padding:16px;margin:6px"><input id="num" type="number" placeholder="Number" style="padding:16px;margin:6px"><h2 id="result" style="color:#f1a978">—</h2></div></main><script>const p=document.getElementById("pct"),n=document.getElementById("num"),r=document.getElementById("result");function c(){const a=parseFloat(p.value),b=parseFloat(n.value);r.textContent=Number.isFinite(a)&&Number.isFinite(b)?a/100*b:"—"}p.oninput=c;n.oninput=c;</script></body></html>
