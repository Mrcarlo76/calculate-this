<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAT Calculator — Calculate This</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.calc-shell{width:min(980px,88vw);margin:auto;padding:145px 0 110px}
.calc-shell h1{font-family:"Playfair Display",serif;font-size:clamp(50px,7vw,82px);line-height:.98;margin:14px 0 16px;font-weight:500}
.lead{color:rgba(255,255,255,.6);font-size:18px;max-width:680px}
.panel{margin-top:42px;border:1px solid rgba(255,255,255,.12);border-radius:26px;background:linear-gradient(145deg,#11191c,#0a0f11);padding:clamp(24px,5vw,48px)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.field label{display:block;font-size:13px;color:#9ca8ad;margin-bottom:8px}
.field input,.field select{width:100%;padding:17px;border-radius:13px;border:1px solid #334044;background:#080d0f;color:white;font:inherit;font-size:18px;outline:0}
.field input:focus,.field select:focus{border-color:#f1a978;box-shadow:0 0 0 3px rgba(241,169,120,.08)}
.result-box{margin-top:24px;padding:28px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.result-label{font-size:12px;color:#8f9b9f;text-transform:uppercase;letter-spacing:.15em}
.result{display:block;font-family:"Playfair Display",serif;color:#f1a978;font-size:clamp(44px,7vw,68px);line-height:1.1;margin:8px 0 6px}
.working{color:#a7b0b3;line-height:1.55}
.actions{display:flex;gap:10px;margin-top:18px}
.action{border:1px solid rgba(255,255,255,.12);background:#101719;color:#e9eeee;border-radius:11px;padding:10px 13px;cursor:pointer}
.back{display:inline-block;margin-top:35px;color:#f1a978}
@media(max-width:680px){.calc-shell{padding-top:115px}.grid{grid-template-columns:1fr}.actions{flex-wrap:wrap}}
</style></head><body>
<header class="nav"><a class="brand" href="index.html"><span class="mark">⌁</span><span>Calculate This</span></a>
<nav><a href="index.html#tools">Tools</a><a href="index.html#categories">Categories</a></nav></header>
<main class="calc-shell"><p class="eyebrow">MONEY & BUSINESS</p><h1>VAT Calculator</h1><p class="lead">Add or remove UK VAT and see the VAT amount clearly.</p>
<section class="panel"><div class="grid"><div class="field"><label for="amount">Amount (£)</label><input id="amount" type="number" inputmode="decimal" placeholder="100"></div>
<div class="field"><label for="rate">VAT rate</label><select id="rate"><option value="20">20% — Standard</option><option value="5">5% — Reduced</option><option value="0">0% — Zero rate</option></select></div>
<div class="field"><label for="mode">Calculation</label><select id="mode"><option value="add">Add VAT</option><option value="remove">Remove VAT</option></select></div></div>
<div class="result-box"><span class="result-label">Total</span><strong class="result" id="result">—</strong>
<div class="working" id="working">Enter your details to calculate.</div>
<div class="actions"><button class="action" id="copyBtn" type="button">Copy result</button><button class="action" id="clearBtn" type="button">Clear</button></div></div></section>
<a class="back" href="index.html">← Back to all tools</a></main><script>function money(n){return new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(n)}
function calculate(){const a=parseFloat(document.getElementById('amount').value),r=parseFloat(document.getElementById('rate').value),m=document.getElementById('mode').value;
if(!Number.isFinite(a)){resultEl.textContent='—';workingEl.textContent='Enter an amount to calculate.';return}
let total,vat;if(m==='add'){vat=a*r/100;total=a+vat;workingEl.textContent=`Net ${money(a)} + VAT ${money(vat)} = ${money(total)}`}
else{total=a/(1+r/100);vat=a-total;workingEl.textContent=`Gross ${money(a)} contains ${money(vat)} VAT. Net = ${money(total)}`}
resultEl.textContent=money(m==='add'?total:total)}
const resultEl=document.getElementById('result'),workingEl=document.getElementById('working');
document.getElementById('clearBtn').onclick=()=>{document.querySelectorAll('.panel input').forEach(x=>x.value='');calculate();};
document.getElementById('copyBtn').onclick=async()=>{if(resultEl.textContent==='—')return;try{await navigator.clipboard.writeText(resultEl.textContent);const b=document.getElementById('copyBtn');b.textContent='Copied';setTimeout(()=>b.textContent='Copy result',1200)}catch(e){}};
document.querySelectorAll('.panel input,.panel select').forEach(x=>x.addEventListener('input',calculate));calculate();</script></body></html>
