<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Convert common length, weight and temperature units instantly.">
<title>Unit Converter — Calculate This</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.calc-shell{width:min(980px,88vw);margin:auto;padding:145px 0 110px}
.calc-shell h1{font-family:"Playfair Display",serif;font-size:clamp(50px,7vw,82px);line-height:.98;margin:14px 0 16px;font-weight:500}
.lead{color:rgba(255,255,255,.6);font-size:18px;max-width:720px;line-height:1.6}
.panel{margin-top:42px;border:1px solid rgba(255,255,255,.12);border-radius:26px;background:linear-gradient(145deg,#11191c,#0a0f11);padding:clamp(24px,5vw,48px)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.field label{display:block;font-size:13px;color:#9ca8ad;margin-bottom:8px}
.field input,.field select{width:100%;padding:17px;border-radius:13px;border:1px solid #334044;background:#080d0f;color:white;font:inherit;font-size:18px;outline:0}
.field input:focus,.field select:focus{border-color:#f1a978;box-shadow:0 0 0 3px rgba(241,169,120,.08)}
.result-box{margin-top:24px;padding:28px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.result-label{font-size:12px;color:#8f9b9f;text-transform:uppercase;letter-spacing:.15em}
.result{display:block;font-family:"Playfair Display",serif;color:#f1a978;font-size:clamp(42px,7vw,66px);line-height:1.1;margin:8px 0 6px}
.working{color:#a7b0b3;line-height:1.65}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.action{border:1px solid rgba(255,255,255,.12);background:#101719;color:#e9eeee;border-radius:11px;padding:10px 13px;cursor:pointer}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.stat{padding:16px;border-radius:14px;background:#0d1315;border:1px solid rgba(255,255,255,.07)}
.stat small{display:block;color:#869297;margin-bottom:5px}.stat strong{font-size:18px}
.note{margin-top:22px;color:#859196;font-size:13px;line-height:1.6}
.back{display:inline-block;margin-top:35px;color:#f1a978}
@media(max-width:680px){.calc-shell{padding-top:115px}.grid,.summary{grid-template-columns:1fr}.actions{flex-wrap:wrap}}
</style></head><body class="has-tool-hero">
<header class="nav"><a class="brand" href="index.html"><span class="mark">⌁</span><span>Calculate This</span></a>
<nav><a href="index.html#tools">Tools</a><a href="index.html#categories">Categories</a></nav></header>
<section class="tool-hero">
  <div class="tool-hero-bg" style="background-image:url('images/tool-heroes/unit-converter.webp')" aria-hidden="true"></div>
  <div class="tool-hero-inner">
    <a class="tool-hero-back" href="index.html">← Back to all tools</a>
    <p class="eyebrow">EVERYDAY</p>
    <h1>Unit Converter</h1>
    <p class="hero-lead">Convert common length, weight and temperature units instantly.</p>
  </div>
</section>
<main class="calc-shell">
<section class="panel"><div class="grid"><div class="field"><label for="type">Conversion</label><select id="type">
<option value="mi-km">Miles → kilometres</option><option value="km-mi">Kilometres → miles</option>
<option value="in-cm">Inches → centimetres</option><option value="cm-in">Centimetres → inches</option>
<option value="kg-st">Kilograms → stone</option><option value="st-kg">Stone → kilograms</option>
<option value="c-f">Celsius → Fahrenheit</option><option value="f-c">Fahrenheit → Celsius</option></select></div>
<div class="field"><label for="value">Value</label><input id="value" type="number" inputmode="decimal" placeholder="10"></div></div>
<div class="result-box"><span class="result-label">Converted value</span><strong class="result" id="result">—</strong>
<div class="working" id="working">Enter your details to calculate.</div><div id="summary" class="summary"></div>
<div class="actions"><button class="action" id="copyBtn" type="button">Copy result</button><button class="action" id="clearBtn" type="button">Clear</button></div></div>
</section>
<a class="back" href="index.html">← Back to all tools</a></main><script>
const resultEl=document.getElementById('result'),workingEl=document.getElementById('working'),summaryEl=document.getElementById('summary');
function calculate(){const t=document.getElementById('type').value,v=+document.getElementById('value').value;if(!Number.isFinite(v)){resultEl.textContent='—';workingEl.textContent='Enter a value to convert.';summaryEl.innerHTML='';return}
let x,label,formula;switch(t){case'mi-km':x=v*1.609344;label='km';formula=`${v} miles = ${x.toFixed(3)} km`;break;case'km-mi':x=v/1.609344;label='miles';formula=`${v} km = ${x.toFixed(3)} miles`;break;case'in-cm':x=v*2.54;label='cm';formula=`${v} inches = ${x.toFixed(2)} cm`;break;case'cm-in':x=v/2.54;label='inches';formula=`${v} cm = ${x.toFixed(2)} inches`;break;case'kg-st':x=v/6.35029318;label='stone';formula=`${v} kg = ${x.toFixed(3)} stone`;break;case'st-kg':x=v*6.35029318;label='kg';formula=`${v} stone = ${x.toFixed(3)} kg`;break;case'c-f':x=v*9/5+32;label='°F';formula=`${v}°C = ${x.toFixed(1)}°F`;break;default:x=(v-32)*5/9;label='°C';formula=`${v}°F = ${x.toFixed(1)}°C`}
resultEl.textContent=`${Number(x.toFixed(4))} ${label}`;workingEl.textContent=formula;summaryEl.innerHTML=''}
document.querySelectorAll('.panel input,.panel select').forEach(x=>x.addEventListener('input',calculate));
document.getElementById('clearBtn').onclick=()=>{document.querySelectorAll('.panel input').forEach(x=>x.value='');calculate();};
document.getElementById('copyBtn').onclick=async()=>{if(resultEl.textContent==='—')return;try{await navigator.clipboard.writeText(resultEl.textContent);const b=document.getElementById('copyBtn');b.textContent='Copied';setTimeout(()=>b.textContent='Copy result',1200)}catch(e){}};
calculate();</script></body></html>
